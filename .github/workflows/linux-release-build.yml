name: Linux Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Linux CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            gcc-aarch64-linux-gnu \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            liblzma-dev \
            libwebkit2gtk-4.1-dev \
            libc6-dev-arm64-cross \
            musl-tools \
            ninja-build \
            pkg-config

      - name: Install zig musl C/C++ toolchain
        run: |
          # Ubuntu ships no musl C++ toolchain (musl-tools is C only), Debian's
          # libstdc++ headers are glibc-targeted, and musl.cc is unreachable from
          # GitHub runners. Zig bundles musl libc + libc++ for
          # x86_64-linux-musl, so expose it under the names cc/cmake probe.
          python3 -m pip install --user --break-system-packages ziglang
          ZIG="$(python3 -c 'import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          "$ZIG" version
          cat > /tmp/musl-cxx-wrapper <<'WRAPPER'
          #!/bin/bash
          # cc-rs passes --target=<rust triple>, which zig cannot parse; the
          # wrapper already pins the C/C++ target below.
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=*) continue ;;
            esac
            # zig always links its own musl crt1.o; rustc's bundled rcrt1.o would
            # define _start/_start_c twice, so drop the Rust-provided copy.
            case "$(basename "$arg")" in
              rcrt1.o|crt1.o) continue ;;
            esac
            args+=("$arg")
          done
          exec "@ZIG@" @MODE@ -target x86_64-linux-musl "${args[@]}"
          WRAPPER
          sed -e "s|@ZIG@|$ZIG|" -e "s|@MODE@|cc|" /tmp/musl-cxx-wrapper > /tmp/musl-gcc
          sed -e "s|@ZIG@|$ZIG|" -e "s|@MODE@|c++|" /tmp/musl-cxx-wrapper > /tmp/musl-g++
          sudo install -m 755 /tmp/musl-gcc /usr/bin/musl-gcc
          sudo install -m 755 /tmp/musl-g++ /usr/bin/musl-g++
          printf '#include <vector>\n#include <string>\nint main(){std::vector<std::string> v; v.push_back(std::string()); return v.size()==1?0:1;}\n' > /tmp/musl_cxx_probe.cpp
          musl-g++ -O2 -c /tmp/musl_cxx_probe.cpp -o /tmp/musl_cxx_probe.o
          ls -l /tmp/musl_cxx_probe.o

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu

      # Fork 补丁：sync 脚本调 corepack pnpm，而 pack:toolpkg 内部又调裸 pnpm，
      # 缺 shim 会报 pnpm: not found。
      # Fork 补丁：插件同步脚本优先用 .ci-tools/typescript，缺失时回退 runner 自带
      # 的 tsc（TypeScript 6），旧 tsconfig 写法会被判非法。与 Windows 对齐到 5.9.3。
      - name: Install repository-managed TypeScript compiler
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .ci-tools/typescript/node_modules/.bin/tsc --version

      - name: Enable corepack pnpm shim
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Bundle models.dev catalog
        run: python3 tools/build_scripts/models_dev_bundle.py

      - name: Check build environment
        run: python3 tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      - name: Build and package Linux app
        if: inputs.products != 'cli'
        run: python3 tools/build_scripts/build_flutter_linux.py --enforce-lockfile

      - name: Build and package Linux CLI
        if: inputs.products != 'app'
        run: python3 tools/build_scripts/build_cli_linux.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Linux app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-linux-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-linux-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14
