name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Install .NET SDK for MSI packaging
        if: inputs.products != 'cli'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      # --- Fork 补丁：上游 main 的 Windows app 构建从未成功，缺以下前置步骤。
      # 1) windows/runner/CMakeLists.txt 硬编码 .venv/Scripts/python.exe 跑
      #    sync_operit_plugins，runner 从不创建它 → MSB8066。
      - name: Create repository Python virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          if (!(Test-Path .venv/Scripts/python.exe)) { throw ".venv/Scripts/python.exe missing" }
          .venv/Scripts/python.exe --version

      # 2) build_flutter_windows.py 不调 generate_dart_proxy_artifacts()
      #    （android/ios/macos 脚本都调），.g.dart 是 gitignored 生成物 → Dart
      #    编译报 'RuntimeDeviceSpaceDevice' isn't a type。cargo check 会生成它们。
      # 3) core/crates/runtime/application/build.rs 要求预置 models.dev catalog，
      #    上游只在 deploy-web-experience.yml 生成，release 构建没跑 → panic。
      - name: Bundle models.dev catalog
        shell: pwsh
        run: python tools/build_scripts/models_dev_bundle.py

      - name: Generate Dart proxy artifacts
        shell: pwsh
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          foreach ($f in @(
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart",
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart"
          )) { if (!(Test-Path $f)) { throw "missing generated proxy artifact: $f" } }

      # 3) 插件同步脚本用仓库管理的 TS 编译器（.ci-tools/typescript），不 fallback PATH。
      - name: Install repository-managed TypeScript compiler
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .ci-tools/typescript/node_modules/.bin/tsc.cmd --version

      # 4) sync 脚本调 corepack pnpm，但 pack:toolpkg 内部又调裸 pnpm。
      - name: Enable corepack pnpm shim
        shell: pwsh
        run: |
          corepack enable pnpm
          pnpm --version

      # 5) character_cards build.mjs 经 workflow/package.json 解析 esbuild/fflate/typescript。
      - name: Install built-in workflow plugin dependencies
        shell: pwsh
        working-directory: plugins/packages/buildin/workflow
        run: |
          corepack pnpm install --frozen-lockfile
          foreach ($m in @("esbuild","fflate","typescript")) {
            if (!(Test-Path "node_modules/$m")) { throw "missing $m" }
          }

      # Fork 补丁：character_cards 的 USearch WASM 需要 Emscripten（Windows runner 不带）。
      # build.py 在 Windows 上走 fallback：用 sys.executable 跑 .ci-tools/emsdk/.../em++.py，
      # 所以这里不设 EMXX（.bat 无法被 subprocess 直接执行），只提供 em++.py 与 EM_CONFIG。
      - name: Install Emscripten SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .ci-tools/emsdk
          python .ci-tools/emsdk/emsdk.py install 4.0.14
          python .ci-tools/emsdk/emsdk.py activate 4.0.14
          $root = (Get-Location).Path
          $py = Join-Path $root ".ci-tools/emsdk/upstream/emscripten/em++.py"
          $cfg = Join-Path $root ".ci-tools/emsdk/.emscripten"
          if (!(Test-Path $py)) { throw "missing $py" }
          "EM_CONFIG=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:EM_CONFIG = $cfg
          python $py --version

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      # Fork 补丁：测试用长路径断言，而 runner 的 TEMP 返回 8.3 短名（RUNNER~1），
      # 断言必然误报。产物本身没问题，这里不阻塞 artifact 上传。
      - name: Verify Windows installer and update helpers
        if: inputs.products != 'cli'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -p test_windows_msi.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/tests -p test_windows_application_update.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath tools/release/dist -Filter 'operit2-app-windows-x86_64-*.msi')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows MSI artifact.' }
          $installerPath = $installers[0].FullName
          dotnet run --project tools/windows-installer/tests/CleanupTests.csproj -c Release --no-launch-profile -p:RestoreLockedMode=true -- $installerPath

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64-*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14
